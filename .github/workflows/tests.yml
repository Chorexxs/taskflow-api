name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SECRET_KEY: ci-secret-key
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Check OpenAPI snapshot
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SECRET_KEY: ci-secret-key
          ENVIRONMENT: test
          CORS_ORIGINS: http://localhost:5173
        run: python scripts/export_openapi.py --check

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SECRET_KEY: ci-secret-key
          TESTING: 1
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
