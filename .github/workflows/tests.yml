name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan history for credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint and type check
        run: |
          ruff check app tests
          ruff format --check app tests
          mypy app

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Check migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SECRET_KEY: ci-secret-key
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Check OpenAPI snapshot
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SECRET_KEY: ci-secret-key
          ENVIRONMENT: test
          CORS_ORIGINS: http://localhost:5173
        run: python scripts/export_openapi.py --check

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
          SECRET_KEY: ci-secret-key
          TESTING: 1
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./coverage.xml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image
        run: docker build -t taskflow-api:ci .

      - name: Verify image has no secrets or local data
        run: |
          docker run --rm --entrypoint sh taskflow-api:ci -c '
            test ! -f /app/.env &&
            test ! -d /app/.git &&
            test ! -f /app/temp.db &&
            test ! -d /app/tests &&
            test ! -d /app/frontend
          '
