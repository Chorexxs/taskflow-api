name: Keep-alive

# Solo mantiene caliente el servicio free de Render, que duerme tras 15 min sin
# tráfico. NO evita la pausa de una base de datos gestionada: se comprobó con
# InsForge (T-130), donde el cron respondió 200 a diario y el proyecto se pausó
# igual hasta el cierre definitivo de la plataforma (T-131).
#
# Tras la migración a Neon (sin pausa por inactividad) este workflow no protege
# nada crítico: es únicamente un calentamiento para evitar el arranque en frío
# del primer usuario del día. Se puede borrar sin afectar a los datos.

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días, 06:17 UTC (evito :00 porque GitHub retrasa)
  workflow_dispatch:        # botón para probarlo a mano

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Despertar API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Render despierto y PostgreSQL accesible
        env:
          READY_URL: https://taskflow-api-gkgl.onrender.com/health/ready
        run: |
          set -u
          # El arranque en frío puede tardar ~30 s; el primer intento suele dar 502/503.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "$READY_URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "Render /health/ready -> 200 (intento $attempt)"
              exit 0
            fi
            echo "Render /health/ready -> '$code' (intento $attempt); reintento en 15 s"
            sleep 15
          done
          echo "::error::/health/ready no devolvió 200: Render caído o PostgreSQL inaccesible"
          exit 1
