name: Keep-alive

# Mantiene activos los tiers gratuitos sin desplegar nada:
# - InsForge pausa los proyectos free tras 7 días sin peticiones.
# - Render duerme el servicio tras 15 min sin tráfico (no lo suspende).
# `/health/ready` ejecuta un SELECT 1 contra PostgreSQL, así que cada
# ejecución despierta Render y genera actividad en InsForge (T-130).

on:
  schedule:
    - cron: "17 6 * * 1,4"   # lunes y jueves, 06:17 UTC (evito :00 porque GitHub retrasa)
  workflow_dispatch:          # botón para probarlo a mano

permissions:
  contents: read

jobs:
  keepalive:
    name: Despertar API y DB
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: GET /health/ready
        run: curl -fsS --max-time 120 -o /dev/null https://taskflow-api-gkgl.onrender.com/health/ready
