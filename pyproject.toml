[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# FastAPI's dependency injection intentionally uses calls (Depends/Query/File)
# in default arguments.
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
# SQLAlchemy models still use the legacy `Column[T]` declarations, so passing
# ORM attributes to functions annotated with plain types is flagged even though
# it is correct at runtime. Migrating to `Mapped[T]` is tracked as debt; keep
# the remaining mypy checks meaningful in the meantime.
disable_error_code = ["arg-type"]
